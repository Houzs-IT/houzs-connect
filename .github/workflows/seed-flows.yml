name: Seed WS-A flows (DRAFT)

# Manual-only. Applies pending migrations, then upserts the rebuilt WS-A
# conversation flows into connect.automation as DRAFT/disabled for the Houzs
# company. Idempotent and non-destructive (no wipe, no sends, DRAFT only), so it
# is safe to re-run. Needs the DATABASE_URL repo secret = the Connect Postgres
# pooler DSN (private repo, so the secret and logs stay private).
on:
  workflow_dispatch:

concurrency:
  group: seed-flows
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    # Supabase's pooler host also advertises IPv6 (AAAA), and GitHub runners have
    # no IPv6 egress (ENETUNREACH on :6543) — force Node to use the IPv4 record.
    env:
      NODE_OPTIONS: --dns-result-order=ipv4first
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Show DB target (user + password LENGTH only, never the password)
        run: node -e "try{const u=new URL(process.env.DATABASE_URL);console.log('host=',u.hostname,'| port=',u.port,'| user=',u.username,'| passlen=',decodeURIComponent(u.password||'').length)}catch(e){console.log('DATABASE_URL did not parse as a URL:',e.message)}"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Apply pending migrations (idempotent)
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Seed WS-A flows (DRAFT, idempotent)
        run: pnpm db:seed:flows
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
