name: Seed WS-A flows (DRAFT)

# Manual-only. Upserts the rebuilt WS-A conversation flows into
# connect.automation per company (COMPANY_FLOW_SETS: Houzs Century's full set and
# 2990's Home's delivery set insert DRAFT/disabled; The Conts' guest-messaging
# set inserts PUBLISHED/enabled so the ERP can fire it by name). Idempotent and
# non-destructive (no wipe, no sends; re-seeds never flip an existing flow's
# status/enabled), so it is safe to re-run. Does
# NOT run db:migrate: the migrate runner can't create its tracking table in the
# connect schema (owned by houzs_connect), so the seed adds the one column it
# needs itself. Needs the DATABASE_URL repo secret = the Connect Postgres pooler
# DSN, and the postgres role must inherit houzs_connect (one-time GRANT).
on:
  workflow_dispatch:
    inputs:
      company:
        description: "Company slug to seed (e.g. 2990). Empty = every company set."
        required: false
        default: ""

concurrency:
  group: seed-flows
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    # Supabase's pooler host also advertises IPv6 (AAAA), and GitHub runners have
    # no IPv6 egress (ENETUNREACH on :6543) — force Node to use the IPv4 record.
    env:
      NODE_OPTIONS: --dns-result-order=ipv4first
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Show DB target (user + password LENGTH only, never the password)
        run: node -e "try{const u=new URL(process.env.DATABASE_URL);console.log('host=',u.hostname,'| port=',u.port,'| user=',u.username,'| passlen=',decodeURIComponent(u.password||'').length)}catch(e){console.log('DATABASE_URL did not parse as a URL:',e.message)}"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Seed WS-A flows (DRAFT, idempotent)
        run: pnpm db:seed:flows ${COMPANY:+--company "$COMPANY"}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          COMPANY: ${{ inputs.company }}
