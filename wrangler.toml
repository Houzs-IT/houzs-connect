name = "houzs-connect"
# Next.js on Cloudflare Workers via OpenNext. `wrangler deploy` uploads the
# adapter build (.open-next/worker.js) produced by `opennextjs-cloudflare build`.
main = ".open-next/worker.js"

# Pin the COMPANY account (hello@houzscentury.com) — the same account the ERP
# (autocount-sync-api) deploys to, so Connect lives beside it. The account id is
# not a secret. Prevents a stray `wrangler login` from targeting the wrong account.
account_id = "816e457307d7fa0491c2a08a72ad5dcd"

# OpenNext requires nodejs_compat and a recent compatibility_date. nodejs_compat
# also gives postgres.js the Node socket/Buffer APIs it needs on Workers.
compatibility_date = "2024-12-30"
# global_fetch_strictly_public: route outbound fetch() through Cloudflare's front
# door even for hostnames on OUR OWN zone. Without it a same-zone subrequest goes
# straight to the zone's origin and SKIPS Workers Routes — and the ERP API is a
# Route (erp.houzscentury.com/api/* -> autocount-sync-api on a Pages origin), so
# every call_rest_api POST to {callback_url} landed on the Pages SPA and came back
# as an empty 400 that the ERP worker never saw (live tail, 2026-10-05). The ERP
# -> Connect direction was never affected: chat.houzscentury.com is a Custom
# Domain, which same-zone fetches do reach. Connect fetches nothing on its own
# hostname, so the "loops back to itself" caveat does not apply.
# https://developers.cloudflare.com/workers/configuration/routing/routes/ ("Routes
# cannot be the target of a same-zone fetch() call").
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

# Run the Worker NEXT TO THE DATABASE (Supabase project "HOUZS ERP SG",
# ap-southeast-1), not next to whoever sent the request. Meta's webhooks come
# from the US, so without this the WhatsApp webhook ran in a US colo and every
# query crossed the Pacific: ~0.4 s each, 1.5–5 s per flow node, 9 s before the
# first node — and the work a tap triggers after the 200 (waitUntil) was cut
# off at the runtime's 30 s, twice on 2026-10-07, before the customer's property
# questions went out. Targeted placement is explicit (no traffic analysis to
# wait for, unlike mode = "smart"). The ERP service binding runs here too; Meta
# API calls go the other way, one per message, which is fine.
[placement]
mode = "targeted"
region = "aws:ap-southeast-1"

# Keep the *.workers.dev URL working alongside the branded custom domain.
workers_dev = true

# Branded custom domain. houzscentury.com is a zone in THIS same account (the ERP
# runs erp.houzscentury.com here), so `wrangler deploy` provisions the chat DNS
# record + TLS cert automatically.
[[routes]]
pattern = "chat.houzscentury.com"
custom_domain = true

# Static assets (Next's public/ + built client chunks), served by the Workers
# Assets runtime. Directory + binding are the OpenNext convention.
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Direct Worker-to-Worker call to the ERP API worker on this account. The
# automation engine's call_rest_api uses it for erp.houzscentury.com (the
# delivery flows' {callback_url}); over the network that POST was answered
# "400, empty body" before the ERP worker ever saw it (2026-10-05). Only this
# Worker calls out; the ERP worker needs no change.
[[services]]
binding = "ERP"
service = "autocount-sync-api"

[vars]
# LIVE since 2026-08-15: the Meta app, WABA and number are set up and the four
# WHATSAPP_* secrets are on the Worker, so sends go out over the Cloud API for
# real. DEMO stubs Meta entirely and only records message rows — put it back to
# DEMO if you ever need to exercise flows without messaging customers.
WHATSAPP_MODE = "LIVE"
# IT Support relays to the Houzs IT Hub. The menu stays hidden until the
# IT_HUB_API_KEY secret (the hub's CONNECT key) is also on the Worker.
IT_HUB_URL = "https://support.houzscentury.com"

[observability]
enabled = true

# ── Supabase Postgres via Hyperdrive ──────────────────────────────────────────
# Connect shares the ERP's COMPANY Supabase project but owns the `connect`
# schema (db/schema.ts qualifies every table), so it never touches the ERP's
# public tables. The connection string lives in the Hyperdrive config on
# Cloudflare, NOT here. Create it ONCE (session pooler / port 5432, matching the
# ERP's proven config), then uncomment the binding and paste the printed id:
#
#   wrangler hyperdrive create houzs-connect-pg \
#     --connection-string="postgresql://postgres.<ref>:<pw>@aws-1-ap-southeast-1.pooler.supabase.com:5432/postgres"
#
# Local dev/scripts read DATABASE_URL from .dev.vars instead of this binding.
# Config houzs-connect-pg -> houzs_connect@anogrigyjbduyzclzjgn (connect schema),
# session pooler 5432. Created 2026-07-29. NOTE: the temp DB password is baked
# into this Hyperdrive config on Cloudflare — when it's rotated, update the config
# with `wrangler hyperdrive update`.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "8da3d98a8fc94f6f938fc06689f9c611"
# LOCAL EMULATION ONLY — never used in production, which connects through the
# `id` above. wrangler refuses to start its platform proxy when a Hyperdrive
# binding has no local string, and `cf:build` / `deploy` both start that proxy
# just to read env vars. Without this line neither command can run on a machine
# that has no local Postgres, which is every machine this app is deployed from.
# Not a secret: it is the conventional localhost dev URL, and real local work
# goes through DATABASE_URL in .dev.vars (see .dev.vars.example), which
# resolveDatabaseUrl() prefers.
localConnectionString = "postgresql://postgres:postgres@localhost:5432/postgres"

# ── Staging ───────────────────────────────────────────────────────────────────
# `--env staging` deploys a separate Worker, houzs-connect-staging, on its OWN
# Supabase project, so testing there never touches live contacts, chats or
# automations. Published by .github/workflows/deploy-staging.yml on a push to the
# `staging` branch. Vars and bindings are not inherited from the top level, so
# nothing below the production [vars]/[[services]] reaches staging unless it is
# repeated here: no ERP service binding, no IT Hub.
[env.staging]
name = "houzs-connect-staging"
# Inherited otherwise: staging must never claim chat.houzscentury.com.
routes = []
workers_dev = true

[env.staging.vars]
# LIVE on the company's Meta token and number (Worker secrets WHATSAPP_TOKEN,
# WHATSAPP_PHONE_NUMBER_ID, WHATSAPP_WABA_ID), fenced by CONNECT_STAGING
# (src/lib/staging-fence.ts): sends only to the STAGING_ALLOWED_PHONES secret,
# call_rest_api only to the ERP staging Worker, no template / number / profile /
# Flow changes. Until WHATSAPP_TOKEN is set nothing reaches Meta at all.
# Production relays the testers' replies here (STAGING_RELAY_PHONES on prod).
WHATSAPP_MODE = "LIVE"
CONNECT_STAGING = "1"

[env.staging.observability]
enabled = true

# Hyperdrive config houzs-connect-staging-pg -> the staging Supabase project.
# Not a secret (the connection string lives on Cloudflare); the deploy workflow
# refuses to run while this is still the placeholder.
[[env.staging.hyperdrive]]
binding = "HYPERDRIVE"
id = "2d7e54e6366a4190985cd2bfb4a6759c"
localConnectionString = "postgresql://postgres:postgres@localhost:5432/postgres"
